<!DOCTYPE html>
<html lang="zh-CN" data-qd-product="life" data-qd-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>发现 · 憩梦时光</title>
  <meta name="theme-color" content="#A9532F">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#q">跳到搜索</a>
  <header class="topbar">
    <div class="wrap">
      <a class="wordmark" href="/"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect width="24" height="24" rx="6" fill="#A9532F"/><circle cx="12" cy="8.2" r="1.5" fill="#FFFFFF"/><path d="M6 14.5c2.2-3.2 4-4.8 6-4.8s3.8 1.6 6 4.8" fill="none" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 16.8h10" fill="none" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round"/></svg>憩梦时光</a>
      <nav class="nav" aria-label="主导航">
        <a href="/">首页</a>
        <a href="/discover.html" aria-current="page">发现</a>
      </nav>
    </div>
  </header>
  <section class="page-band">
    <div class="wrap">
      <p class="eyebrow" data-reveal>AI 时代人找人</p>
      <h1 data-reveal style="--i:1">发现</h1>
      <p class="lede" data-reveal style="--i:2">按关键词找人。这里只列出已经发布的网站，不会编造。</p>
    </div>
  </section>
  <main class="wrap discover">
    <form id="search-form" class="panel search-panel">
      <label for="q">关键词</label>
      <div class="composer">
        <input id="q" name="q" type="search" placeholder="例如：民宿、摄影、双月湾" maxlength="40">
        <button class="primary" id="search" type="submit"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="5.5"/><path d="M15.5 15.5L20 20"/></svg>搜索</button>
      </div>
      <div class="suggest" id="suggest" aria-label="试试这些词">
        <button type="button" class="chip" data-q="民宿">民宿</button>
        <button type="button" class="chip" data-q="摄影">摄影</button>
        <button type="button" class="chip" data-q="双月湾">双月湾</button>
      </div>
    </form>
    <p class="result-count" id="result-count" role="status"></p>
    <div id="results" class="result-list discover-results"></div>
    <p id="empty" class="empty-state hidden"></p>
  </main>
  <footer class="app-footer">
    <div class="wrap">
      <p class="brand-lockup"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect width="24" height="24" rx="6" fill="#A9532F"/><circle cx="12" cy="8.2" r="1.5" fill="#FFFFFF"/><path d="M6 14.5c2.2-3.2 4-4.8 6-4.8s3.8 1.6 6 4.8" fill="none" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 16.8h10" fill="none" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round"/></svg><span><span class="mother">憩梦</span> · 憩梦时光</span></p>
      <p class="notice" id="model-notice"></p>
    </div>
  </footer>
  <script src="/icons.js"></script>
  <script src="/motion.js"></script>
  <script src="/discover.js"></script>
</body>
</html>
